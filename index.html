<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negotiate-Copilot — Real-Time AI Negotiation Coach</title>
    <meta name="description" content="AI-powered real-time negotiation coaching using Gemini Live API">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ══════════════════════════════════════════════════════════════════
           DESIGN SYSTEM — Negotiate-Copilot Hackathon Edition
           ══════════════════════════════════════════════════════════════════ */
        :root {
            /* Backgrounds */
            --bg-deep: #050a18;
            --bg-body: #0a1128;
            --bg-card: rgba(16, 28, 56, 0.6);
            --bg-card-solid: #101c38;
            --bg-hover: rgba(30, 50, 90, 0.5);
            --bg-glass: rgba(12, 22, 48, 0.55);

            /* Text */
            --text-primary: #e8ecf4;
            --text-secondary: #7a8baa;
            --text-muted: #4a5a78;

            /* Accent Palette */
            --accent-cyan: #00d4ff;
            --accent-blue: #4d7cff;
            --accent-purple: #a855f7;
            --accent-magenta: #e040fb;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --accent-orange: #ffab40;
            --accent-gold: #ffd740;

            /* Gradients */
            --grad-primary: linear-gradient(135deg, #4d7cff, #a855f7, #e040fb);
            --grad-cyan: linear-gradient(135deg, #00d4ff, #4d7cff);
            --grad-success: linear-gradient(135deg, #00e676, #00d4ff);
            --grad-danger: linear-gradient(135deg, #ff5252, #e040fb);
            --grad-warm: linear-gradient(135deg, #ffab40, #ff5252);

            /* Borders */
            --border-subtle: rgba(77, 124, 255, 0.15);
            --border-glow: rgba(0, 212, 255, 0.3);

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            /* Shadows */
            --shadow-glow-cyan: 0 0 20px rgba(0, 212, 255, 0.15), 0 0 60px rgba(0, 212, 255, 0.05);
            --shadow-glow-blue: 0 0 20px rgba(77, 124, 255, 0.2), 0 0 60px rgba(77, 124, 255, 0.05);
            --shadow-glow-purple: 0 0 20px rgba(168, 85, 247, 0.2);
            --shadow-glow-red: 0 0 25px rgba(255, 82, 82, 0.25);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);

            /* Transitions */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Background ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(77, 124, 255, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 50% 90%, rgba(0, 212, 255, 0.08) 0%, transparent 60%);
            animation: bgPulse 8s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes bgPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* Animated grid lines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(77, 124, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 124, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Particle Canvas (behind everything) ── */
        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Glass Components ── */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
        }

        /* ── Buttons ── */
        button {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s var(--ease-out-expo);
            position: relative;
            overflow: hidden;
        }

        .btn-glass {
            background: rgba(77, 124, 255, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(77, 124, 255, 0.2);
        }
        .btn-glass:hover {
            background: rgba(77, 124, 255, 0.2);
            border-color: rgba(77, 124, 255, 0.4);
            box-shadow: var(--shadow-glow-blue);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--grad-primary);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(77, 124, 255, 0.3);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(77, 124, 255, 0.5);
            transform: translateY(-2px) scale(1.02);
        }
        .btn-primary:active { transform: translateY(0) scale(0.98); }

        .btn-danger {
            background: var(--grad-danger);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 25px rgba(255, 82, 82, 0.5);
            transform: translateY(-2px);
        }

        /* Shimmer effect on primary button */
        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { left: -60%; }
            50% { left: 120%; }
        }

        /* ── Inputs & Selects ── */
        input, select {
            background: rgba(10, 17, 40, 0.8);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 10px 14px;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 13px;
            outline: none;
            transition: all 0.3s var(--ease-out-expo);
        }
        input:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), var(--shadow-glow-cyan);
        }
        select { cursor: pointer; }

        /* ══════════════════════════════════════════════════════════════════
           LAYOUT
           ══════════════════════════════════════════════════════════════════ */

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(5, 10, 24, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 100;
            position: relative;
        }

        /* Animated bottom border glow */
        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), var(--accent-magenta), transparent);
            opacity: 0.5;
            animation: headerGlow 4s ease-in-out infinite alternate;
        }
        @keyframes headerGlow { 0% { opacity: 0.3; } 100% { opacity: 0.7; } }

        .header-left, .header-center, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-center { flex: 1; justify-content: center; }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 16px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--grad-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(77, 124, 255, 0.4);
        }
        .logo-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 16px;
            background: var(--grad-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .api-key-input {
            width: 280px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        /* Status Indicator */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid var(--border-subtle);
            background: rgba(10, 17, 40, 0.6);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.4s var(--ease-out-expo);
        }
        .status-dot.live {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green), 0 0 20px rgba(0, 230, 118, 0.3);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        .status-dot.error {
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }
        .timer-display {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 48px;
        }

        /* ── Main Layout ── */
        main {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* ── Dashboard (Center) ── */
        .dashboard {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 40px 24px;
            gap: 28px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-subtle) transparent;
        }

        /* ── BATNA Section ── */
        .batna-section {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        .batna-title {
            font-family: var(--font-display);
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #fff 0%, #00d4ff 40%, #a855f7 70%, #e040fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.2));
            animation: titleGlow 3s ease-in-out infinite alternate;
            margin-bottom: 12px;
        }
        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.15)); }
            100% { filter: drop-shadow(0 0 40px rgba(168, 85, 247, 0.25)); }
        }

        .phase-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: rgba(168, 85, 247, 0.1);
            color: #c084fc;
            transition: all 0.5s var(--ease-out-expo);
            animation: badgePulse 3s ease-in-out infinite;
        }
        .phase-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c084fc;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.1); }
            50% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.2); }
        }

        /* BATNA Detail Cards */
        .batna-details {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s var(--ease-out-expo);
        }
        .batna-details.visible { opacity: 1; transform: translateY(0); }

        .detail-card {
            padding: 16px 28px;
            border-radius: 14px;
            min-width: 160px;
            text-align: center;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            transition: all 0.3s var(--ease-out-expo);
        }
        .detail-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow-cyan);
        }
        .detail-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .detail-value {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        /* ── Hint Box ── */
        .hint-container {
            width: 100%;
            max-width: 650px;
            padding: 28px 32px;
            border-radius: 18px;
            position: relative;
            text-align: center;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s var(--ease-out-expo);
            /* Default empty state */
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px dashed var(--border-subtle);
        }
        .hint-container.active {
            border-style: solid;
            border-color: rgba(255, 82, 82, 0.4);
            background: rgba(255, 82, 82, 0.06);
            box-shadow: var(--shadow-glow-red);
            animation: hintPulse 2s ease-in-out infinite;
        }
        .hint-container.active-blue {
            border-style: solid;
            border-color: rgba(0, 212, 255, 0.4);
            background: rgba(0, 212, 255, 0.05);
            box-shadow: var(--shadow-glow-cyan);
            animation: hintPulseCyan 2.5s ease-in-out infinite;
        }
        @keyframes hintPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 82, 82, 0.15); }
            50% { box-shadow: 0 0 40px rgba(255, 82, 82, 0.3); }
        }
        @keyframes hintPulseCyan {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.15); }
            50% { box-shadow: 0 0 35px rgba(0, 212, 255, 0.25); }
        }

        .hint-label {
            position: absolute;
            top: -11px;
            left: 50%;
            transform: translateX(-50%);
            padding: 2px 16px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 8px;
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            color: var(--accent-cyan);
        }

        .hint-text {
            font-size: 20px;
            font-weight: 500;
            line-height: 1.5;
        }
        .hint-container:not(.active):not(.active-blue) .hint-text {
            color: var(--text-muted);
            font-size: 14px;
            font-style: italic;
        }

        /* ── Audio Visualization ── */
        .audio-section {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .waveform-wrapper {
            width: 100%;
            padding: 2px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(168, 85, 247, 0.2));
        }
        #audio-canvas {
            width: 100%;
            height: 90px;
            border-radius: 12px;
            background: rgba(5, 10, 24, 0.8);
            display: block;
        }

        /* Talk Ratio */
        .talk-ratio {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }
        .ratio-pill {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            letter-spacing: 0.5px;
            transition: all 0.4s var(--ease-out-expo);
        }
        .ratio-client {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.25);
            color: var(--accent-red);
        }
        .ratio-you {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.25);
            color: var(--accent-cyan);
        }

        /* ── Key Events Timeline ── */
        .timeline-container {
            width: 100%;
            margin-top: auto;
            padding: 20px 0 8px;
            border-top: 1px solid var(--border-subtle);
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-subtle) transparent;
        }
        .timeline-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .timeline-events {
            display: flex;
            gap: 12px;
            min-width: min-content;
        }
        .event-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            background: var(--bg-glass);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(8px);
            animation: eventSlideIn 0.4s var(--ease-spring) forwards;
            opacity: 0;
        }
        @keyframes eventSlideIn {
            from { opacity: 0; transform: translateX(-20px) scale(0.9); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        .event-time {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* ══════════════════════════════════════════════════════════════════
           SIDE PANELS
           ══════════════════════════════════════════════════════════════════ */
        .side-panel {
            position: absolute;
            top: 16px;
            bottom: 16px;
            width: 380px;
            background: rgba(5, 10, 24, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s var(--ease-out-expo), opacity 0.3s ease;
            box-shadow: var(--shadow-card), 0 0 40px rgba(0,0,0,0.3);
            z-index: 50;
            opacity: 0;
        }
        .side-panel.open { opacity: 1; }

        /* Left: Pros & Cons */
        #pros-cons-panel { left: 16px; transform: translateX(-110%); }
        #pros-cons-panel.open { transform: translateX(0); }

        /* Right: Dev Console */
        #dev-console-panel { right: 16px; transform: translateX(110%); width: 420px; }
        #dev-console-panel.open { transform: translateX(0); }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .panel-title {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 14px;
        }
        .close-btn:hover {
            background: rgba(255, 82, 82, 0.15);
            border-color: rgba(255, 82, 82, 0.3);
            color: var(--accent-red);
        }

        /* Pros & Cons Content */
        .pros-cons-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pro-item, .con-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }
        .pro-item {
            background: rgba(0, 230, 118, 0.06);
            border: 1px solid rgba(0, 230, 118, 0.15);
            color: var(--accent-green);
        }
        .con-item {
            background: rgba(255, 82, 82, 0.06);
            border: 1px solid rgba(255, 82, 82, 0.15);
            color: var(--accent-red);
        }
        .pro-item::before { content: "✦"; font-weight: bold; color: var(--accent-green); }
        .con-item::before { content: "✦"; font-weight: bold; color: var(--accent-red); }

        /* Dev Console */
        #log-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(77, 124, 255, 0.1);
            border-radius: 12px;
            padding: 14px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scrollbar-width: thin;
        }
        .log-entry { word-break: break-all; }
        .log-time { color: var(--text-muted); margin-right: 8px; }
        .log-out { color: #60a5fa; } /* Blue for outgoing */
        .log-in { color: #c084fc; }  /* Purple for incoming */
        .log-err { color: var(--accent-red); }
        .log-entry.log-block-out { border-left: 3px solid rgba(96, 165, 250, 0.4); padding-left: 10px; margin: 4px 0; }
        .log-entry.log-block-in { border-left: 3px solid rgba(192, 132, 252, 0.4); padding-left: 10px; margin: 4px 0; }

        .panel-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        /* ══════════════════════════════════════════════════════════════════
           UTILITY ANIMATIONS
           ══════════════════════════════════════════════════════════════════ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.6s var(--ease-out-expo) forwards; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-blue); }
    </style>
</head>
<body>

    <!-- Particle Background -->
    <canvas id="particles-canvas"></canvas>

    <!-- ═══ HEADER ═══ -->
    <header>
        <div class="header-left">
            <div class="logo">
                <div class="logo-icon">🤝</div>
                <span class="logo-text">NEGOTIATE COPILOT</span>
            </div>
            <select id="lang-select">
                <option value="en">🌐 EN</option>
                <option value="pl">🇵🇱 PL</option>
                <option value="ua">🇺🇦 UA</option>
            </select>
            <select id="preset-select">
                <option value="system_audio">🔊 System Audio</option>
                <option value="microphone">🎙️ Microphone</option>
            </select>
        </div>

        <div class="header-center">
            <input type="password" id="api-key-input" class="api-key-input" placeholder="🔑  Gemini API Key" />
            <button id="session-btn" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span data-i18n="ui.startSession">START SESSION</span>
            </button>
        </div>

        <div class="header-right">
            <button id="dev-console-toggle" class="btn-glass">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                DEV
            </button>
            <div class="status-badge">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text" style="color: var(--text-secondary)" data-i18n="ui.offline">Offline</span>
            </div>
            <span id="timer" class="timer-display">00:00</span>
        </div>
    </header>

    <!-- ═══ MAIN ═══ -->
    <main>
        <!-- Left Panel: Pros & Cons -->
        <aside id="pros-cons-panel" class="side-panel">
            <div class="panel-header">
                <span class="panel-title" data-i18n="ui.contextInsights">⚡ Context Insights</span>
                <button class="close-btn" onclick="document.getElementById('pros-cons-panel').classList.remove('open')">✕</button>
            </div>
            <div id="pros-cons-content" class="pros-cons-content">
                <div style="color: var(--text-muted); font-style: italic; font-size: 13px; text-align: center; margin-top: 40px;" data-i18n="ui.awaitingContext">
                    Awaiting context triggers...
                </div>
            </div>
        </aside>

        <!-- Center Dashboard -->
        <div class="dashboard">

            <!-- BATNA -->
            <div class="batna-section fade-in-up">
                <div id="strategy-title" class="batna-title">BATNA</div>
                <div id="phase-badge" class="phase-badge">Awaiting Audio</div>

                <div id="batna-details" class="batna-details">
                    <div class="detail-card">
                        <div class="detail-label" data-i18n="battlecard.clientAnchor">Client Anchor</div>
                        <div id="val-client-anchor" class="detail-value">—</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label" data-i18n="battlecard.yourTarget">Your Target</div>
                        <div id="val-your-target" class="detail-value">—</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label" data-i18n="battlecard.zopa">ZOPA</div>
                        <div id="val-zopa" class="detail-value">—</div>
                    </div>
                </div>
            </div>

            <!-- Hint Box -->
            <div id="hint-box" class="hint-container fade-in-up" style="animation-delay: 0.1s">
                <div class="hint-label" data-i18n="ui.hintBox">💡 What to Say</div>
                <div id="hint-text" class="hint-text" data-i18n="ui.waitingHint">Waiting for negotiation context…</div>
            </div>

            <!-- Audio Waveform -->
            <div class="audio-section fade-in-up" style="animation-delay: 0.2s">
                <div class="waveform-wrapper">
                    <canvas id="audio-canvas"></canvas>
                </div>
                <div class="talk-ratio">
                    <div id="ratio-client" class="ratio-pill ratio-client">CLIENT  —%</div>
                    <div id="ratio-you" class="ratio-pill ratio-you">YOU  —%</div>
                </div>
            </div>

            <!-- Timeline -->
            <div class="timeline-container fade-in-up" style="animation-delay: 0.3s">
                <div class="timeline-label" data-i18n="ui.keyEvents">📌 Key Events</div>
                <div id="timeline-events" class="timeline-events"></div>
            </div>

        </div>

        <!-- Right Panel: Dev Console -->
        <aside id="dev-console-panel" class="side-panel">
            <div class="panel-header">
                <span class="panel-title" data-i18n="ui.devConsole">🖥️ Developer Console</span>
                <button class="close-btn" onclick="document.getElementById('dev-console-panel').classList.remove('open')">✕</button>
            </div>
            <div id="log-area">
                <div class="log-entry" style="color: var(--text-muted);">Ready. Connect to start logging Gemini messages.</div>
            </div>
            <div class="panel-controls">
                <button class="btn-glass" onclick="document.getElementById('log-area').innerHTML=''" style="flex:1; font-size: 12px;">Clear</button>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 11px; cursor: pointer; color: var(--text-secondary);">
                    <input type="checkbox" id="auto-scroll-toggle" checked> Auto-scroll
                </label>
            </div>
        </aside>
    </main>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
